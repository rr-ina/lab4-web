<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Lab 4 Ryndych Dariia</title>
</head>
<body>
  <h1>Web Lab 4 Ryndych Dariia</h1>

  <p>Status: <span id="status">Not logged in</span></p>

  <button onclick="login()">Login</button>
  <button onclick="getUserInfo()" id="btn-userinfo">Get User Info</button>

  <p id="result">Place for user information</p>

  <h2>Cryptocurrency Updates</h2>
  <button onclick="subscribeToUpdates()">Subscribe to Updates</button>
  <div id="prices"></div>

  <script>
    let socket = null;
    
    window.onload = async function() {
      await checkStatus();
    }

    async function checkStatus() {
      const res = await fetch("/user-info", { credentials: "include" });
      if (res.status === 200) {
        document.getElementById("status").textContent = "Logged in";
      } else {
        document.getElementById("status").textContent = "Not logged in";
      }
    }

    function login() {
      window.location.href = "/login";
    }

    async function getUserInfo() {
      const res = await fetch("/user-info", { credentials: "include" });
      const data = await res.json();

      if (res.status === 401) {
        document.getElementById("status").textContent = "Not logged in";
        document.getElementById("result").textContent = "401 Unauthorized";
      } else {
        document.getElementById("status").textContent = "Logged in";
        document.getElementById("result").textContent = JSON.stringify(data, null, 2);
      }
    }

    async function subscribeToUpdates() {
      if (socket && socket.readyState === WebSocket.OPEN) {
        alert("Вже підключено!");
        return;
      }

      const res = await fetch("/token", { credentials: "include" });
      if (res.status !== 200) {
        alert("Спочатку увійдіть в систему!");
        return;
      }
      const data = await res.json();
      const token = data.token;

      socket = new WebSocket("wss://localhost:8443/ws/prices?token=" + token);
      socket.binaryType = "arraybuffer";

      socket.onopen = function() {
        document.getElementById("status").textContent = "Connected to WebSocket";
      };

      socket.onmessage = function(event) {
        const bytes = new Uint8Array(event.data);
        const { symbol, price } = decodeProtobuf(bytes);
        updatePrice(symbol, price);
      };

      socket.onclose = function() {
        document.getElementById("status").textContent = "WebSocket disconnected";
      };
    }
    
    function decodeProtobuf(bytes) {
      let symbol = "";
      let price = "";
      let i = 0;
      while (i < bytes.length) {
        const tag = bytes[i++];
        const fieldNumber = tag >> 3;
        let length = 0;
        let shift = 0;
        while (true) {
          const b = bytes[i++];
          length |= (b & 0x7F) << shift;
          if ((b & 0x80) === 0) break;
          shift += 7;
        }
        const value = new TextDecoder().decode(bytes.slice(i, i + length));
        i += length;
        if (fieldNumber === 1) symbol = value;
        else if (fieldNumber === 2) price = value;
      }
      return { symbol, price };
    }

    function updatePrice(symbol, price, time) {
      const pricesDiv = document.getElementById("prices");
      let row = document.getElementById("price-" + symbol);
      if (!row) {
        row = document.createElement("p");
        row.id = "price-" + symbol;
        pricesDiv.appendChild(row);
      }
      const rounded = parseFloat(price).toFixed(2);
      row.textContent = symbol + ": $" + rounded;
    }
  </script>
</body>
</html>
